<style>

<body>
<div class="wrap">
<div id="login" class="card login">
  <h1>🔐 Ingia</h1>

<div id="toast" class="toast hide"></div><div id="modal" class="modal hide"><div class="card"><p id="mm"></p><div class="row"><button onclick="ans(true)">Ndiyo</button><button class="sec" onclick="ans(false)">Hapana</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const ST=["Present","Off duty","Sick","Sick Leave","Annual Leave","Maternity Leave","Emergency","Absent"];
const STAFF=["Cashier","Customer Care"],SH=["Asubuhi","Mchana"];
let S={users:[{id:1,name:"Administrator",username:"admin",password:"admin123",role:"Admin"}],att:{},shifts:{}};
try{const r=localStorage.getItem("ams2");if(r)S=JSON.parse(r)}catch(e){}
S.closed=S.closed||{};S.kd=S.kd||{};S.leaves=S.leaves||[];S.svl=S.svl||[];S.abs=S.abs||{};S.vit=S.vit||{};S.mauzo=S.mauzo||[];S.layout=S.layout||{};
S.kl=Array.isArray(S.kl)&&S.kl.length?S.kl:["Morocco","Gerezani","Kivukoni","Ubungo","Kimara"];const KANDA=S.kl;
// Pakia state ya Supabase bila kuvunja reference ya KANDA inayotumiwa na UI.
function hydrateState(remote){
 const incoming=remote&&typeof remote==="object"?remote:{};
 const keepKanda=KANDA;
 Object.assign(S,incoming);
 S.kl=keepKanda;
 const incomingKanda=Array.isArray(incoming.kl)&&incoming.kl.length?incoming.kl:["Morocco","Gerezani","Kivukoni","Ubungo","Kimara"];
 keepKanda.splice(0,keepKanda.length,...incomingKanda);
 S.users=Array.isArray(S.users)?S.users:[];
 S.att=S.att||{};S.shifts=S.shifts||{};S.closed=S.closed||{};S.kd=S.kd||{};
 S.leaves=S.leaves||[];S.svl=S.svl||[];S.abs=S.abs||{};S.vit=S.vit||{};
 S.mauzo=S.mauzo||[];S.layout=S.layout||{};
}
// WEKA Supabase Project URL na anon/publishable key hapa chini.
const SUPABASE_URL="WEKA_SUPABASE_PROJECT_URL_HAPA";
const SUPABASE_ANON_KEY="WEKA_SUPABASE_ANON_KEY_HAPA";
const SUPABASE_TABLE="attendance_app_state";
let DB=null,RO=false,_ready=false,_pend=false,_dirty=false,_late=false,_defer=false,_t=null,_cfg=null,_days=null,_last={},_seeded=false,_channel=null;
const save=()=>{try{localStorage.setItem("ams2",JSON.stringify(S))}catch(e){}
 if(DB&&!RO){_dirty=true;clearTimeout(_t);_t=setTimeout(flush,500)}};
/* Data inagawanywa: cfg/main (watumiaji, kanda, vituo, likizo) + day/<tarehe> (mahudhurio, shifts, mauzo ya siku hiyo) */
function splitS(){const D={},g=d=>D[d]=D[d]||{att:{},shifts:{},kd:{},closed:{},mauzo:[]};
 ["att","shifts","kd","closed"].forEach(f=>Object.keys(S[f]||{}).forEach(k=>{const i=k.indexOf("|");g(k.slice(0,i))[f][k.slice(i+1)]=S[f][k]}));
 (S.mauzo||[]).forEach(m=>g(m.d).mauzo.push(m));return D}
const cfgOf=()=>({users:S.users,kl:S.kl,vit:S.vit,leaves:S.leaves,svl:S.svl,abs:S.abs,layout:S.layout});
function stamp(){const D=splitS();_last={"cfg/main":JSON.stringify(cfgOf())};Object.keys(D).forEach(d=>{_last["day/"+d]=JSON.stringify(D[d])})}
async function flush(){
 if(!DB||RO||_pend||!_dirty)return;
 _pend=true;
 try{
  do{
   _dirty=false;
   const payload={id:"main",state:S,updated_at:new Date().toISOString()};
   const {error}=await DB.from(SUPABASE_TABLE).upsert(payload,{onConflict:"id"});
   if(error)throw error;
  }while(_dirty);
 }catch(e){
  _dirty=false;
  note("Kuhifadhi mtandaoni kumeshindikana: "+(e.message||e.code||"hitilafu")+". Hakikisha Supabase URL, key na ruhusa (RLS) zimewekwa.");
 }finally{
  _pend=false;
  if(_late){_late=false;onRemote()}
 }
}
function applyRemote(){const c=_cfg;if(!c)return;const DM=_days||new Map();
 S.users=c.users||S.users;S.vit=c.vit||{};S.leaves=c.leaves||[];S.svl=c.svl||[];S.abs=c.abs||{};S.layout=c.layout||{};
 S.kl.splice(0,S.kl.length,...(c.kl&&c.kl.length?c.kl:S.kl));
 const a={},sh={},kd={},cl={},mz=[];
 [...DM.keys()].sort().forEach(d=>{const b=DM.get(d)||{};
  [[a,"att"],[sh,"shifts"],[kd,"kd"],[cl,"closed"]].forEach(([o,f])=>Object.keys(b[f]||{}).forEach(u=>{o[d+"|"+u]=b[f][u]}));
  (b.mauzo||[]).forEach(m=>mz.push(m))});
 S.att=a;S.shifts=sh;S.kd=kd;S.closed=cl;S.mauzo=mz;stamp();
 if(me){const u=S.users.find(x=>x.id===me.id);if(u)me=u;else{logout();note("Akaunti yako imeondolewa.")}}}
function onRemote(){if(_pend||_dirty){_late=true;return}if(!_cfg)return;applyRemote();_ready=true;softDraw()}
function softDraw(){if(!me)return;const a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){_defer=true;return}draw()}
document.addEventListener("focusout",()=>{if(_defer){_defer=false;setTimeout(softDraw,80)}});
async function initSync(){
 const configured=SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("WEKA_")&&SUPABASE_ANON_KEY.length>20&&!SUPABASE_ANON_KEY.includes("WEKA_");
 if(!configured||!window.supabase||!window.supabase.createClient){
  _ready=true;
  note("Supabase haijaunganishwa. Weka Project URL na anon/publishable key; kwa sasa taarifa zinahifadhiwa kwenye kifaa hiki tu.");
  return;
 }
 try{
  DB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const {data,error}=await DB.from(SUPABASE_TABLE).select("state").eq("id","main").maybeSingle();
  if(error)throw error;
  if(data&&data.state){
   hydrateState(data.state);
   _last.main=JSON.stringify(S);
  }else{
   const {error:writeError}=await DB.from(SUPABASE_TABLE).upsert({id:"main",state:S,updated_at:new Date().toISOString()},{onConflict:"id"});
   if(writeError)throw writeError;
  }
  _channel=DB.channel("attendance-live-sync")
   .on("postgres_changes",{event:"*",schema:"public",table:SUPABASE_TABLE,filter:"id=eq.main"},payload=>{
    if(!payload.new||!payload.new.state)return;
    if(_dirty||_pend){_late=true;return}
    hydrateState(payload.new.state);
    _last.main=JSON.stringify(S);
    if(me){const u=S.users.find(x=>x.id===me.id);if(u)me=u;else logout();softDraw()}
   }).subscribe();
  _ready=true;
  if(me)draw();
  note("Imeunganishwa na Supabase. Mabadiliko yanasawazishwa live.");
 }catch(e){
  DB=null;_ready=true;
  note("Supabase imeshindwa kuunganishwa: "+(e.message||e.code||"hitilafu"));
 }
}
const syncBar=()=>DB?'<div class="mu" style="text-align:right;margin-bottom:6px">🟢 Live: Supabase — mabadiliko yanashirikishwa kwa vifaa vyote</div>':'<div class="card" style="border-left:4px solid #e08a00"><b>⚠ Hali ya kifaa kimoja.</b> Supabase haijaunganishwa; taarifa hazitasawazishwa kwenye vifaa vingine.</div>';
let me=null,tab="mark",markDate=iso(new Date()),rp="day",rd=iso(new Date()),rd2=iso(new Date()),ar="Supervisor",an="",rs="all",rg="all",rsh="all",sr="Cashier",sn="",spf="",ssh="Asubuhi",sk="Morocco",mkU="",mkQ="",rk="all",mkS="Present",okd="Morocco";
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fd(x){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(x||""));return m?(+m[3])+"-"+MON[+m[2]-1]+"-"+m[1]:(x||"")}
function fmt(d){return d.toLocaleDateString("en-GB",{weekday:"long"})+" "+fd(iso(d))}
function tick(){const n=new Date();["d0","d1"].forEach(i=>{const e=document.getElementById(i);if(e)e.textContent=fmt(n)});["clock","clock0"].forEach(i=>{const c=document.getElementById(i);if(c)c.textContent=n.toLocaleTimeString("en-GB")})}
setInterval(tick,1000);tick();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function note(m){const t=$("toast");t.textContent=m;t.classList.remove("hide");clearTimeout(window._t);window._t=setTimeout(()=>t.classList.add("hide"),3500)}
let _cf=null;
function ask(m,f){_cf=f;$("mm").textContent=m;$("modal").classList.remove("hide")}
function ans(y){$("modal").classList.add("hide");const f=_cf;_cf=null;if(y&&f)f()}
const nm=id=>(S.users.find(u=>u.id===id)||{name:"?"}).name;
const adm=()=>me&&me.role==="Admin",afs=()=>me&&me.role==="Afisa",mgr=()=>adm()||afs();
const staff=()=>S.users.filter(u=>STAFF.includes(u.role));
const rlist=()=>staff().filter(u=>(rg==="all"||u.role===rg)&&(rk==="all"||u.kanda===rk)&&(rsh==="all"||!u.shift||u.shift===rsh));
function login(){if(!_ready){$("err").textContent="Inapakia data za mtandao, jaribu tena baada ya sekunde chache";return}const u=S.users.find(x=>x.username&&x.username===$("u").value.trim()&&x.password===$("p").value);
 if(!u){$("err").textContent="Jina au nenosiri si sahihi";return}
 enter(u)}
function enter(u){me=u;$("login").classList.add("hide");$("app").classList.remove("hide");$("who").textContent=u.name+" ("+u.role+")";tab=afs()?"rep":"mark";navOpen=false;draw()}
function logout(){me=null;$("app").classList.add("hide");$("login").classList.remove("hide");$("p").value="";$("err").textContent=""}
let navOpen=false;
function draw(){
 const t=[...(afs()?[]:[["mark","✅ Mark Attendance"]]),["rep","📊 Reports"],["lv","🏖️ Likizo"],["mau","💰 Mauzo"]];if(adm()){t.push(["lay","📐 Layout"]);t.push(["shf","🕒 Shifts"])}if(mgr()){t.push(["stf","🧑‍💼 Staff"]);t.push(["usr","🔑 Users (Login)"])}t.push(["set","⚙️ Settings"]);
 const cur=t.filter(x=>x[0]===tab);$("nav").innerHTML=(navOpen?t:cur).map(x=>`<button class="${tab===x[0]?"on":""}" onclick="tab='${x[0]}';navOpen=false;draw()">${x[1]}</button>`).join("")+`<button class="sec" onclick="navOpen=!navOpen;draw()">${navOpen?"✖ Funga menyu":"☰ Menyu"}</button>`;
 $("view").innerHTML=syncBar()+lvBanner()+(tab==="lv"?vLikizo():tab==="mau"?vMauzo():tab==="set"?vSet():tab==="mark"?vMark():tab==="rep"?vRep():tab==="stf"?vStf():tab==="shf"?vShf():tab==="lay"?vLay():vUsr());
}
function missingFor(d,uid){const sh=S.shifts[d+"|"+uid],kd=S.kd[d+"|"+uid];
 return staff().filter(u=>(!sh||!u.shift||u.shift===sh)&&(!kd||!u.kanda||u.kanda===kd)&&!S.att[d+"|"+u.id])}
function pendingDay(uid){const t=iso(new Date()),ds=Object.keys(S.shifts).filter(k=>k.endsWith("|"+uid)&&k.slice(0,10)<t).map(k=>k.slice(0,10)).sort();
 for(const d of ds){const m=missingFor(d,uid);if(m.length)return{d,n:m.length}}return null}
function openShift(sh){const k=iso(new Date())+"|"+me.id;if(S.shifts[k]){note("Umeshafungua shift leo.");return}
 const pd=pendingDay(me.id);if(pd){note("Huwezi kufungua shift mpya. Bado hujajaza wafanyakazi "+pd.n+" wa tarehe "+pd.d+". Wasiliana na Admin.");return}
 if(!okd){note("Chagua kanda kwanza");return}
 const kd=okd;
 ask("Fungua shift ya "+sh+" kanda ya "+kd+"? Huwezi kufungua shift/kanda nyingine leo.",()=>{S.shifts[k]=sh;S.kd[k]=kd;save();draw()})}
function missingMau(d,uid){const sh=S.shifts[d+"|"+uid],kd=S.kd[d+"|"+uid];
 return staff().filter(u=>u.role==="Cashier"&&(!sh||!u.shift||u.shift===sh)&&(!kd||!u.kanda||u.kanda===kd)&&(S.att[d+"|"+u.id]||{}).s==="Present"&&!S.mauzo.some(m=>m.d===d&&m.cid===u.id&&m.kd===kd&&m.sh===sh))}
function closeShift(){const k=iso(new Date())+"|"+me.id;if(S.closed[k])return;
 const m=missingFor(iso(new Date()),me.id);if(m.length){note("Huwezi kufunga shift. Bado hujajaza wafanyakazi "+m.length+": "+m.slice(0,3).map(u=>u.name).join(", ")+(m.length>3?"...":""));return}
 const mm=missingMau(iso(new Date()),me.id);if(mm.length){note("Huwezi kufunga shift. Bado hujajaza mauzo ya cashier "+mm.length+": "+mm.slice(0,3).map(u=>u.name).join(", ")+(mm.length>3?"...":""));return}
 ask("Funga shift yako? Hutaweza kujaza mahudhurio tena leo.",()=>{S.closed[k]=new Date().toLocaleTimeString("en-GB");save();draw()})}
function reopen(k){ask("Fungua tena shift hii?",()=>{delete S.closed[k];save();draw()})}
function effDay(){if(adm())return markDate;const t=iso(new Date());if(!S.shifts[t+"|"+me.id]){const pd=pendingDay(me.id);if(pd)return pd.d}return t}
function mark(uid,d,s){const k=d+"|"+uid,o=S.att[k],t=iso(new Date());
 if(!adm()&&d!==t){const pd=pendingDay(me.id);if(!pd||pd.d!==d){note("Huwezi kujaza mahudhurio ya tarehe hii.");draw();return}}
 else{
 if(!adm()&&!S.shifts[t+"|"+me.id]){note("Fungua shift yako kwanza.");draw();return}
 if(!adm()&&S.closed[t+"|"+me.id]){note("Shift yako imefungwa.");draw();return}}
 if(o&&!adm()){note("Mfanyakazi huyu tayari amejazwa leo.");return}
 const go=()=>{S.att[k]={s:s,by:me.id,sh:adm()?"Admin":S.shifts[d+"|"+me.id],kd:adm()?"":S.kd[d+"|"+me.id]};save();draw()};
 if(o)ask("Badilisha status iliyopo ("+o.s+")?",go);else go()}
function setK(id,v){const u=S.users.find(x=>x.id===id);if(u){u.kanda=v;save();note("Kanda imehifadhiwa")}}
function setSh(id,v){const u=S.users.find(x=>x.id===id);if(u){u.shift=v;save();note("Shift imehifadhiwa")}}
function mkLabel(u){return (u.pf||"-")+" - "+u.name}
function markSel(){const d=effDay(),q=($("mkq")?$("mkq").value:mkQ).trim().toLowerCase();
 if(!q){note("Andika au chagua jina la mfanyakazi kwanza");return}
 const t=!adm()?S.shifts[d+"|"+me.id]:null,k=!adm()?S.kd[d+"|"+me.id]:null,
 sl=staff().filter(u=>(!t||!u.shift||u.shift===t)&&(!k||!u.kanda||u.kanda===k)&&(mkR==="all"||u.role===mkR));
 let m=sl.filter(u=>mkLabel(u).toLowerCase()===q||u.name.toLowerCase()===q||String(u.pf||"").toLowerCase()===q);
 if(!m.length)m=sl.filter(u=>mkLabel(u).toLowerCase().includes(q));
 if(!m.length){note("Hakuna mfanyakazi anayelingana na \""+q+"\"");return}
 if(m.length>1){note("Majina "+m.length+" yanafanana. Andika jina kamili au PF No, au chagua kwenye orodha.");return}
 mkQ="";mark(m[0].id,d,mkS)}
function vMark(){
 const d=effDay(),pend=!adm()&&d!==iso(new Date());let h="";const cl=!adm()&&!pend&&S.closed[d+"|"+me.id],msh=adm()?null:S.shifts[d+"|"+me.id],mk=adm()?null:S.kd[d+"|"+me.id],
 sl0=staff().filter(u=>(!msh||!u.shift||u.shift===msh)&&(!mk||!u.kanda||u.kanda===mk)),
 sl=sl0.filter(u=>mkR==="all"||u.role===mkR);
 if(!adm()){const sh=S.shifts[d+"|"+me.id];

/* ===== Layout (mgawanyo wa staff kwa kanda) ===== */
let lyS="Asubuhi",lyR="Cashier";
const lyQ=()=>{S.layout=S.layout||{};const a=S.layout[lyS]=S.layout[lyS]||{};return a[lyR]=a[lyR]||{}};
const lyPool=()=>staff().filter(u=>u.role===lyR&&(!u.shift||u.shift===lyS));
const lyTot=()=>{const q=lyQ();return KANDA.reduce((a,k)=>a+(q[k]||0),0)};
function setLq(i,v){if(!adm()||KANDA[i]===undefined)return;lyQ()[KANDA[i]]=Math.max(0,Math.floor(+v)||0);save();draw()}
const lyVis=u=>(u.cyc||[]).filter(k=>KANDA.includes(k));
function lyRun(){if(!adm())return;const q=lyQ(),pool=lyPool(),tot=lyTot();
 if(!tot){note("Weka idadi ya staff kwenye angalau kanda moja");return}
 if(tot>pool.length){note("Idadi uliyoweka ("+tot+") imezidi staff waliopo ("+pool.length+")");return}
 ask("Gawanya "+tot+" "+lyR+" wa shift ya "+lyS+" kwa nasibu (random)? Hakuna atakayerudi kanda aliyowahi kupangwa hadi mzunguko wake ukamilike.",()=>{
  const shf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  pool.forEach(u=>{if(!u.cyc)u.cyc=u.kanda?[u.kanda]:[];u.cyc=lyVis(u);if(KANDA.every(k=>u.cyc.includes(k)))u.cyc=[]});
  const slots=shf(KANDA.flatMap(k=>Array(q[k]||0).fill(k))),P=shf(pool.slice());
  /* Matching: kila nafasi (slot) ipate staff asiyewahi kuwepo kwenye kanda hiyo kwenye mzunguko wake */
  const own=slots.map(()=>null),by={};
  const aug=(si,seen)=>{const k=slots[si];for(const u of shf(P.filter(x=>!x.cyc.includes(k)))){if(seen.has(u.id))continue;seen.add(u.id);
    if(by[u.id]===undefined||aug(by[u.id],seen)){by[u.id]=si;own[si]=u;return true}}return false};
  let miss=[];slots.forEach((k,si)=>{if(!aug(si,new Set()))miss.push(si)});
  const left=shf(P.filter(u=>by[u.id]===undefined));
  miss.forEach(si=>{const u=left.shift();if(u){by[u.id]=si;own[si]=u}});
  pool.forEach(u=>{if(u.shift===lyS){u.shift="";u.kanda=""}});
  own.forEach((u,si)=>{if(!u)return;const k=slots[si];u.shift=lyS;u.kanda=k;if(!u.cyc.includes(k))u.cyc.push(k)});
  save();draw();note(miss.length?"Imegawanywa. Wafanyakazi "+miss.length+" wamerudia kanda kwa sababu ya idadi ndogo ya staff.":"Staff wamegawanywa kwa nasibu ✔")})}
function lyResetCyc(){if(!adm())return;ask("Anza mzunguko upya kwa "+lyR+" wote (futa kumbukumbu ya kanda walizopitia)?",()=>{staff().filter(u=>u.role===lyR).forEach(u=>{u.cyc=u.kanda?[u.kanda]:[]});save();draw();note("Mzunguko umeanza upya ✔")})}
function vLay(){
 if(!adm())return`<div class="card">Ukurasa huu ni wa Admin tu.</div>`;
 const q=lyQ(),pool=lyPool(),tot=lyTot(),all=staff().filter(u=>u.role===lyR),oth=all.filter(u=>u.shift&&u.shift!==lyS).length,
 free=pool.filter(u=>u.shift!==lyS||!u.kanda).length,bad=tot>pool.length;
 let h=`<div class="card"><h2>📐 Layout ya Staff</h2><div class="mu" style="margin-bottom:10px">Chagua shift na nafasi, weka idadi ya staff kwa kila kanda, kisha mfumo utawagawanya kwenye kanda.</div><div class="row"><label class="mu">Shift:</label><select onchange="lyS=this.value;draw()">${SH.map(x=>`<option ${lyS===x?"selected":""}>${x}</option>`).join("")}</select><label class="mu">Nafasi:</label><select onchange="lyR=this.value;draw()">${STAFF.map(x=>`<option ${lyR===x?"selected":""}>${x}</option>`).join("")}</select></div></div>`;
 h+=`<div class="card"><h2>${esc(lyR)} - Shift ya ${lyS}</h2><div class="mu" style="margin-bottom:8px">Wanaopatikana: <b>${pool.length}</b>${oth?` (wengine ${oth} wako shift nyingine)`:""}. Bado hawajapangwa kanda: <b>${free}</b>.</div><div class="sc"><table><tr><th>Kanda</th><th>Idadi unayotaka</th><th>Waliopangwa sasa</th><th>Majina (kanda alizopitia/jumla)</th></tr>`;
 KANDA.forEach((k,i)=>{const a=all.filter(u=>u.shift===lyS&&u.kanda===k);
  h+=`<tr><td><b>${esc(k)}</b></td><td><input type="number" min="0" inputmode="numeric" style="width:90px" value="${q[k]||0}" onchange="setLq(${i},this.value)"></td><td><span class="sb">${a.length}</span></td><td class="mu" style="white-space:normal;min-width:200px">${a.length?a.map(u=>esc(u.name)+` <span class="sb">${lyVis(u).length}/${KANDA.length}</span>`).join(" "):"-"}</td></tr>`});
 h+=`<tr><th>JUMLA</th><th><span class="${bad?"blink":""}">${tot} / ${pool.length}</span></th><th colspan="2"></th></tr></table></div>`+(bad?`<div class="err">Idadi imezidi staff waliopo. Punguza idadi au ongeza staff kwenye menyu ya Staff.</div>`:"")+`<div class="row" style="margin-top:10px"><button onclick="lyRun()" ${tot&&!bad?"":"disabled"}>🔀 Gawanya Staff (Random)</button><button class="sec" onclick="lyResetCyc()">♻️ Anza mzunguko upya</button></div><div class="mu" style="margin-top:8px">Ugawaji ni wa nasibu. Staff hapangiwi kanda aliyowahi kupangwa hadi apitie kanda zote (mzunguko ukamilike); ndipo mzunguko mpya unaanza.</div></div>`;
 return h}

/* ===== Theme ===== */
const THEMES=[["white","☀️ White"],["dark","🌙 Dark"],["orange","🟠 Orange"]];
function getTheme(){try{const t=localStorage.getItem("ams_theme");if(THEMES.some(x=>x[0]===t))return t}catch(e){}return"white"}
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);
 const l=$("lth");if(l)l.innerHTML=THEMES.map(x=>`<button class="${x[0]===t?"on":""}" onclick="setTheme('${x[0]}')">${x[1]}</button>`).join("")}
function setTheme(t){try{localStorage.setItem("ams_theme",t)}catch(e){}applyTheme(t);if(me)draw()}
function vSet(){
 if(!KANDA.includes(mvK))mvK=KANDA[0];
 const t=getTheme();
 let h=`<div class="card"><h2>🎨 Theme</h2><div class="mu" style="margin-bottom:8px">Chagua muonekano wa mfumo.</div><div class="row themes">${THEMES.map(x=>`<button class="${x[0]===t?"on":""}" onclick="setTheme('${x[0]}')">${x[1]}</button>`).join("")}</div></div>`;
 if(adm())h+=`<div class="card"><h2>📍 Kanda (${KANDA.length})</h2><div class="mu" style="margin-bottom:8px">Ongeza au ondoa kanda. Huwezi kuondoa kanda ambayo ina wafanyakazi waliopangwa.</div><div class="row"><input class="grow" id="kdn" placeholder="Jina la kanda mpya" onkeydown="if(event.key==='Enter')addKd()"><button onclick="addKd()">Ongeza Kanda</button></div><div class="err" id="kde"></div><div class="row">${KANDA.map((x,i)=>`<span class="sb">${esc(x)} <button class="del" onclick="delKd(${i})">✖</button></span>`).join("")}</div>
 <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line,#8884)"><h3 style="margin:0 0 6px">🚏 Vituo vya kanda</h3><div class="mu" style="margin-bottom:8px">Chagua kanda kisha ongeza au ondoa vituo vyake.</div><div class="row"><select onchange="mvK=this.value;draw()">${KANDA.map(x=>`<option ${mvK===x?"selected":""}>${esc(x)}</option>`).join("")}</select><input class="grow" id="mvn" placeholder="Jina la kituo" value="${esc(mvN)}" oninput="mvN=this.value" onkeydown="if(event.key==='Enter')addVit()"><button onclick="addVit()">Ongeza Kituo</button></div><div class="err" id="mve"></div><div class="row">${(S.vit[mvK]||[]).length?(S.vit[mvK]||[]).map((x,i)=>`<span class="sb">${esc(x)} <button class="del" onclick="delVit('${esc(mvK)}',${i})">✖</button></span>`).join(""):`<span class="mu">Bado hakuna kituo kwenye kanda ya ${esc(mvK)}.</span>`}</div></div></div>`;
 h+=`<div class="card"><h2>🔑 Badilisha Password</h2><div class="mu" style="margin-bottom:8px">Ingiza password ya sasa kisha password mpya (angalau herufi 4).</div><div class="row"><input class="grow" id="cp0" type="password" placeholder="Password ya sasa" autocomplete="current-password"><input class="grow" id="cp1" type="password" placeholder="Password mpya" autocomplete="new-password"><input class="grow" id="cp2" type="password" placeholder="Rudia password mpya" autocomplete="new-password"><button onclick="chPw()">Badilisha</button></div><div class="err" id="cpe"></div></div>`;
 return h}
function fixKd(){const f=KANDA[0]||"";[ "okd","sk","mvK","mvKa"].forEach(v=>{if(!KANDA.includes(eval(v)))eval(v+"=f")});if(rk!=="all"&&!KANDA.includes(rk))rk="all";if(mfK!=="all"&&!KANDA.includes(mfK))mfK="all"}
function addKd(){if(!adm())return;const i=$("kdn"),e=$("kde"),n=i.value.trim();
 if(!n){e.textContent="Andika jina la kanda";return}
 if(/[<>"']/.test(n)){e.textContent="Jina lisiwe na alama < > \" '";return}
 if(KANDA.some(x=>x.toLowerCase()===n.toLowerCase())){e.textContent="Kanda hii tayari ipo";return}
 KANDA.push(n);save();draw();note("Kanda imeongezwa ✔")}
function delKd(i){if(!adm())return;const k=KANDA[i];if(k===undefined)return;
 if(KANDA.length<=1){note("Lazima abaki na angalau kanda moja");return}
 const n=S.users.filter(u=>u.kanda===k).length;
 if(n){note("Huwezi kuondoa "+k+": kuna wafanyakazi "+n+" wamepangwa humo. Wahamishie kanda nyingine kwanza.");return}
 ask("Ondoa kanda ya "+k+"? Rekodi za zamani zitabaki.",()=>{const j=KANDA.indexOf(k);if(j>-1)KANDA.splice(j,1);fixKd();save();draw();note("Kanda imeondolewa ✔")})}
function chPw(){const o=$("cp0").value,a=$("cp1").value,b=$("cp2").value,e=$("cpe");
 if(!me||me.password!==o){e.textContent="Password ya sasa si sahihi";return}
 if(a.length<4){e.textContent="Password mpya iwe na angalau herufi 4";return}
 if(a!==b){e.textContent="Password mpya hazifanani";return}
 if(a===o){e.textContent="Password mpya lazima iwe tofauti na ya zamani";return}
 const u=S.users.find(x=>x.id===me.id);if(u)u.password=a;me.password=a;save();draw();note("Password imebadilishwa ✔")}
function resetPw(id){const i=$("pw_"+id),v=i?i.value:"";if(v.length<4){note("Password mpya iwe na angalau herufi 4");return}
 const u=S.users.find(x=>x.id===id);if(!u)return;u.password=v;save();i.value="";note("Password ya "+u.name+" imebadilishwa ✔")}
applyTheme(getTheme());
initSync();
$("p").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script>
